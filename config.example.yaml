# OPTIONAL seed file. Settings normally live in the database and are edited in
# the web UI (http://localhost:8080/). This file is only read when passed with
# -config / METEOCOMP_CONFIG, and only seeds a database that has no settings yet.
# ${ENV_VARS} and ${ENV_VARS:-default} are expanded at load time.
http:
  addr: ":8080"            # overridden by -addr / METEOCOMP_HTTP_ADDR
database:
  path: "meteocomp.db"     # overridden by -db / METEOCOMP_DB_PATH

# Shared by all providers. Minimum 1m.
poll_interval: 1h

locations:
  - { name: paris, city: Paris, country: FR, latitude: 48.8566, longitude: 2.3522 }
  - { name: london, city: London, country: GB, latitude: 51.5074, longitude: -0.1278 }

# Any number of provider instances. The same type may appear several times
# with different names, keys or options. Available types:
#   openmeteo       no key needed;   options: endpoint (Open-Meteo API path after /v1/,
#                   default "forecast"; e.g. "meteofrance", "dwd-icon", "gfs", "ecmwf"),
#                   models (optional, e.g. "arome_france"), forecast_days (1-16, default 7)
#   openweathermap  api_key needed;  5 day / 3 hour forecast
#   weatherapi      api_key needed;  options: days (1-14, default 3)
#   infoclimat      api_key (token) needed; hourly station observations;
#                   options: station_id (required), past_days (1-30, default 7)
providers:
  - name: open-meteo
    type: openmeteo
    options: { forecast_days: 7 }

  - name: owm
    type: openweathermap
    # api_key: "..."   # or set OWM_API_KEY, which overrides it, or use the web UI
    enabled: false

  - name: weatherapi
    type: weatherapi
    # api_key: "..."   # or set WEATHER_API_KEY, which overrides it, or use the web UI
    enabled: false

  # Météo-France AROME (France) + ARPEGE through Open-Meteo, about 4 days, no key needed.
  - name: meteofrance
    type: openmeteo
    options: { endpoint: meteofrance, forecast_days: 4 }
    enabled: false

  # Infoclimat station observations (requires a token from https://www.infoclimat.fr/opendata/).
  # One instance per station; configure multiple instances to cover several locations.
  - name: infoclimat
    type: infoclimat
    # api_key: "..."   # Infoclimat token
    options:
      station_id: "000PU"   # Castanet-Tolosan
      past_days: 7
    enabled: false
